# Self-hosted production compose for pre-built Dentora images.
# All values are read from .env — no defaults are embedded here.
#
# Required in .env:
#   APP_IMAGE, PORT
#   DATABASE_URL
#   ADMIN_PASSWORD, ADMIN_SESSION_SECRET
#   CLINIC_SESSION_SECRET

services:
  app:
    image: ${APP_IMAGE}
    pull_policy: always
    container_name: dentora-app
    restart: unless-stopped
    ports:
      - "${PORT}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      CLINIC_SESSION_SECRET: ${CLINIC_SESSION_SECRET}
      CLINIC_OTP_TTL_MIN: ${CLINIC_OTP_TTL_MIN}
      CLINIC_OTP_MAX_ATTEMPTS: ${CLINIC_OTP_MAX_ATTEMPTS}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}
      MAILTRAP_INBOX_ID: ${MAILTRAP_INBOX_ID}
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD}
      KAPSO_BASE_URL: ${KAPSO_BASE_URL}
      KAPSO_API_KEY: ${KAPSO_API_KEY}
      KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID}
      KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET}
      CAMPAIGN_DRY_RUN: ${CAMPAIGN_DRY_RUN}
      CAMPAIGN_DELAY_MS: ${CAMPAIGN_DELAY_MS}
      CAMPAIGN_MAX_PER_RUN: ${CAMPAIGN_MAX_PER_RUN}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
      SERAPI_MAX_SEARCHES: ${SERAPI_MAX_SEARCHES}
      SERAPI_DELAY_MS: ${SERAPI_DELAY_MS}
      SERPAPI_MONTHLY_BUDGET: ${SERPAPI_MONTHLY_BUDGET}
      SERPAPI_HOURLY_LIMIT: ${SERPAPI_HOURLY_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
